steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_BACKEND_URL}
      - -t
      - gcr.io/$PROJECT_ID/omnipro-220:latest
      - ./frontend
    timeout: 900s

  - name: "gcr.io/cloud-builders/docker"
    args: [push, gcr.io/$PROJECT_ID/omnipro-220:latest]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - omnipro-220
      - --image=gcr.io/$PROJECT_ID/omnipro-220:latest
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
