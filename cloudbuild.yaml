steps:
  # ── Build backend ──────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - gcr.io/$PROJECT_ID/omnipro-backend:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/omnipro-backend:latest
      - .
    timeout: 1200s

  # ── Push backend ───────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args: [push, gcr.io/$PROJECT_ID/omnipro-backend:$COMMIT_SHA]

  # ── Deploy backend to Cloud Run ────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - omnipro-backend
      - --image=gcr.io/$PROJECT_ID/omnipro-backend:$COMMIT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=300
      - --set-env-vars=ANTHROPIC_API_KEY=$$ANTHROPIC_API_KEY
    secretEnv: ["ANTHROPIC_API_KEY"]

  # ── Build frontend ─────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -f
      - frontend/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_API_URL=https://omnipro-backend-$_BACKEND_SUFFIX
      - -t
      - gcr.io/$PROJECT_ID/omnipro-frontend:$COMMIT_SHA
      - ./frontend
    timeout: 900s

  # ── Push frontend ──────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    args: [push, gcr.io/$PROJECT_ID/omnipro-frontend:$COMMIT_SHA]

  # ── Deploy frontend to Cloud Run ───────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - omnipro-frontend
      - --image=gcr.io/$PROJECT_ID/omnipro-frontend:$COMMIT_SHA
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --memory=512Mi
      - --cpu=1

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/anthropic-api-key/versions/latest
      env: ANTHROPIC_API_KEY

images:
  - gcr.io/$PROJECT_ID/omnipro-backend:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/omnipro-frontend:$COMMIT_SHA

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
